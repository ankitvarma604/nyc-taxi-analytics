version: 2

sources:
  - name: raw
    database: bigquery-public-data
    schema: new_york_taxi_trips
    tables:
      - name: tlc_yellow_trips_2022
        description: "Raw NYC Yellow Taxi trip records for 2022"

models:
  - name: stg_taxi_trips
    description: "Cleaned and renamed raw NYC taxi trips"
    columns:
      - name: fare_amount
        description: "Base fare in USD"
        tests:
          - not_null
      - name: trip_distance
        description: "Trip distance in miles"
        tests:
          - not_null
      - name: payment_type
        description: "Payment method code"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6]